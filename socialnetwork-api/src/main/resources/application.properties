# Application name
spring.application.name=socialnetwork-app

# Application port
server.port=8080

# Spring: Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SN_JPA_SHOW_SQL:false}

# Spring: PostgreSQL Configuration
spring.datasource.url=${SN_DB_URL:jdbc:postgresql://localhost:5432/socialnetwork_db}
spring.datasource.username=${SN_DB_USERNAME:socialnetwork_user}
spring.datasource.password=${SN_DB_PASSWORD:socialnetwork_password}

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Spring: Redis Configuration
spring.data.redis.host=${SN_REDIS_HOST:localhost}
spring.data.redis.port=${SN_REDIS_PORT:6379}
spring.data.redis.password=${SN_REDIS_PASSWORD:}
spring.cache.type=redis

# Pagination: cap client-requested page size (default Spring limit is 2000)
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20

# Posts cache
socialnetwork.cache.posts.ttl=PT10M

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SocialNetwork Custom Properties
socialnetwork.email.from=mail@skov.dev
socialnetwork.email.verify-base-url=http://localhost:8080/api/v1/auth/verify?token=

# Login brute-force protection
socialnetwork.security.login-rate-limit.max-attempts=5
socialnetwork.security.login-rate-limit.window=PT15M

# Authenticated principal cache (per instance; avoids a DB lookup on every request)
socialnetwork.security.principal-cache.ttl=PT30S

# AWS IAM User Access
aws.iam.user.accessKey=${SN_AWS_ACCESS_KEY_ID}
aws.iam.user.secretKey=${SN_AWS_SECRET_ACCESS_KEY}

# AWS Secrets Manager
aws.secretsmanager.secretName.socialnetwork-security-private-public-keys=socialnetwork-security-private-public-keys

# AWS S3 (avatar storage)
socialnetwork.aws.s3.avatar-bucket-name=${SN_AWS_S3_AVATAR_BUCKET_NAME:socialnetwork-user-avatar-upload}
socialnetwork.aws.s3.avatar-presigned-url-duration=PT1H

# Multipart upload (avatar image upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AWS Secrets Manager (OpenAI key)
aws.secretsmanager.secretName.socialnetwork-openai-api-key=socialnetwork-openai-api-key

# Spring AI (comment reply suggestions). The api-key placeholder below is required by Spring AI's
# own auto-configuration but is never used: AiClientConfig builds the OpenAiChatModel bean itself
# with the real key fetched from AWS Secrets Manager, which takes precedence.
spring.ai.openai.api-key=unused
spring.ai.openai.chat.options.model=gpt-4.1-2025-04-14

# AI safeguards: per-user request cap and provider HTTP timeouts
socialnetwork.ai.rate-limit.max-requests=10
socialnetwork.ai.rate-limit.window=PT1M
socialnetwork.ai.timeout.connect=PT5S
socialnetwork.ai.timeout.read=PT30S
